<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Photo Switcher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="profile-container">

        <h1>My Profile</h1>

        <div class="profile-card">

            <img
                id="profilePhoto"
                src="assets/casual.jpg"
                alt="Shahd casual profile photo"
            >

            <h2>Shahd Al-Khateeb</h2>

            <p id="photoDescription">
                Casual Profile
            </p>

            <button id="switchButton" type="button">
                Switch Photo
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
